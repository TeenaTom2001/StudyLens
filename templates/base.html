<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>StudyFocus</title>
<style>body{font:17px system-ui;background:#f3f5fa;color:#17243b;max-width:1000px;margin:40px auto;padding:0 20px}header{border-bottom:3px solid #4764cf;margin-bottom:28px}h1{letter-spacing:-1px}section{background:white;padding:24px;border-radius:14px;margin:20px 0}label{display:block;margin:14px 0}input,select,textarea,button{font:inherit;padding:9px;max-width:95%}input:not([type=checkbox]),select,textarea{display:block}button{background:#304daa;color:white;border:0;border-radius:6px;cursor:pointer}table{border-collapse:collapse;width:100%;font-size:14px}td,th{text-align:left;border-bottom:1px solid #ddd;padding:9px}.note{background:#e8edff;padding:14px;border-radius:8px}.muted{color:#536179}a{color:#304daa}</style>
<header><h1>StudyFocus</h1><p>Plan. Record. Reflect.</p></header>
{% for message in get_flashed_messages() %}<p role="status" class="note">{{message}}</p>{% endfor %}
{% block content %}{% endblock %}<footer><p class="muted">Local research prototype · All session durations and distractions are self-reported.</p></footer></html>
